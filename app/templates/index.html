<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>工单分析</title>
<style>body{font:16px/1.6 system-ui;max-width:760px;margin:4rem auto;padding:0 1rem;color:#17212b}main{padding:2rem;border:1px solid #ccd5dc;border-radius:12px}button{padding:.6rem 1rem}small{color:#596673}</style>
<main><h1>家用电器售后工单分析</h1><p>上传一份家电售后工单 JSON。系统会核对订单、型号、物流及售后记录，并生成处理建议和回复草稿。</p>{% if configuration_issue %}<p role="alert"><strong>暂不能分析工单。</strong>{{ configuration_issue }}</p>{% else %}<form action="/cases/upload" method="post" enctype="multipart/form-data"><label>工单 JSON <input type="file" name="file" accept=".json,application/json" required></label><button type="submit">上传并分析</button></form>{% endif %}<p><small>渗水、破损、异味、冒烟或异常发热时，请先停止使用并勿通电。退款申请由客服人工审核；回复草稿需客服确认后使用。</small></p></main></html>
